<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:512px;height:512px;overflow:hidden;background:transparent}
</style></head><body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ticket body: rounded rect with a semicircular notch bitten out of
         each short edge; the notch circles are centred on the edge so only
         their inner half is removed -->
    <mask id="ticket">
      <rect x="8" y="110" width="496" height="290" rx="30" fill="#ffffff"/>
      <circle cx="8" cy="255" r="45" fill="#000000"/>
      <circle cx="504" cy="255" r="45" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#ticket)">
    <!-- main body -->
    <rect x="8" y="110" width="496" height="290" fill="#FC6E7F"/>
    <!-- darker stub on the tear-off side -->
    <rect x="8" y="110" width="170" height="290" fill="#F5375A"/>
    <!-- perforation; drawn inside the mask so the dashes finish flush
         with the top and bottom edges -->
    <line x1="132" y1="104" x2="132" y2="406"
          stroke="#FFE477" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="18 22"/>
  </g>

  <!-- coin -->
  <circle cx="295" cy="255" r="88" fill="#FFEE8A"/>
  <circle cx="295" cy="255" r="60" fill="#FFD764"/>
  <rect x="289" y="232" width="12" height="46" rx="6" fill="#FFF9E3"/>
</svg>
</body></html>
